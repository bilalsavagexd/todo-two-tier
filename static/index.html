<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
  :root { --bg:#f3f6f4; --surface:#fff; --text:#1d2b26; --muted:#66756f; --accent:#1f7a5c; --accent-text:#fff; --line:#d7e0db; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121a17; --surface:#1a2521; --text:#e6efeb; --muted:#94a59e; --accent:#4fc79d; --accent-text:#0b1a14; --line:#2b3a34; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: Georgia, serif; line-height:1.5; }
  main { max-width:480px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .add { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; min-width:0; padding:12px; font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:12px 16px; background:var(--accent); color:var(--accent-text); }
  button.del { background:transparent; color:var(--muted); padding:4px 10px; }
  ul { list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  li { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li label { flex:1; overflow-wrap:anywhere; }
  li.done label { text-decoration:line-through; color:var(--muted); }
  .empty { padding:20px 12px; color:var(--muted); text-align:center; }
  #error { color:#c0392b; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>My To-Do List</h1>
  <p class="sub">Tasks are stored in a database through the API.</p>
  <div class="add">
    <input type="text" id="newTask" placeholder="What needs doing?" aria-label="New task">
    <button id="addBtn">Add task</button>
  </div>
  <p id="error"></p>
  <ul id="list"></ul>
</main>
<script>
  const list = document.getElementById("list");
  const input = document.getElementById("newTask");
  const errorBox = document.getElementById("error");

  // Talks to the backend. Relative URL, so it works wherever the app is served.
  async function api(path, options) {
    try {
      const res = await fetch("/api/tasks" + path, {
        headers: { "Content-Type": "application/json" }, ...options
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      errorBox.textContent = "";
      return res.status === 204 ? null : res.json();
    } catch (e) {
      errorBox.textContent = "Could not reach the server: " + e.message;
      throw e;
    }
  }

  async function load() {
    const tasks = await api("", { method: "GET" });
    list.innerHTML = "";
    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty">No tasks yet. Add your first one above.</li>';
    }
    tasks.forEach(task => {
      const li = document.createElement("li");
      if (task.done) li.className = "done";

      const box = document.createElement("input");
      box.type = "checkbox"; box.checked = task.done; box.id = "t" + task.id;
      box.onchange = async () => {
        await api("/" + task.id, { method: "PATCH", body: JSON.stringify({ done: box.checked }) });
        load();
      };

      const label = document.createElement("label");
      label.htmlFor = box.id; label.textContent = task.text;

      const del = document.createElement("button");
      del.className = "del"; del.textContent = "Delete";
      del.onclick = async () => { await api("/" + task.id, { method: "DELETE" }); load(); };

      li.append(box, label, del);
      list.appendChild(li);
    });
  }

  async function addTask() {
    const text = input.value.trim();
    if (!text) return;
    await api("", { method: "POST", body: JSON.stringify({ text }) });
    input.value = "";
    load();
  }

  document.getElementById("addBtn").onclick = addTask;
  input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
  load().catch(() => {});
</script>
</body>
</html>
